services:

  mysql:
    image: mysql:8.4
    container_name: autocare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysqlpassword
      MYSQL_DATABASE: autocare_db
    ports:
      - "3307:3306"
    volumes:
      - autocare_mysql_data:/var/lib/mysql
      - ./database/01_create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
      - ./database/02_create_tables.sql:/docker-entrypoint-initdb.d/02_create_tables.sql:ro
      - ./database/03_insert_sample_data.sql:/docker-entrypoint-initdb.d/03_insert_sample_data.sql:ro
      - ./database/06_procedures.sql:/docker-entrypoint-initdb.d/06_procedures.sql:ro
      - ./database/07_functions.sql:/docker-entrypoint-initdb.d/07_functions.sql:ro
      - ./database/08_triggers.sql:/docker-entrypoint-initdb.d/08_triggers.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysqlpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: mjayashree08/autocare-backend:latest
    container_name: autocare-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/autocare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysqlpassword
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    image: mjayashree08/autocare-frontend:latest
    container_name: autocare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  autocare_mysql_data: